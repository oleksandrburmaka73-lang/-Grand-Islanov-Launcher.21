name: Build Grand Islanov Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/grandislanov/launcher app/src/main/assets

          if [ ! -f app/src/main/AndroidManifest.xml ] && [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          if [ ! -f app/src/main/java/com/grandislanov/launcher/MainActivity.kt ] && [ -f MainActivity.kt ]; then
            cp MainActivity.kt app/src/main/java/com/grandislanov/launcher/MainActivity.kt
          fi

          if [ ! -f app/src/main/assets/index.html ] && [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
          fi

          if [ ! -f app/build.gradle ]; then
            cat > app/build.gradle <<'EOF'
            plugins {
                id 'com.android.application'
                id 'org.jetbrains.kotlin.android'
            }

            android {
                namespace 'com.grandislanov.launcher'
                compileSdk 35

                defaultConfig {
                    applicationId 'com.grandislanov.launcher'
                    minSdk 23
                    targetSdk 28
                    versionCode 1
                    versionName '1.0'
                }

                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }

                kotlinOptions {
                    jvmTarget = '17'
                }
            }
            EOF
          fi

          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/grandislanov/launcher/MainActivity.kt

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grand-Islanov-Launcher
          path: app/build/outputs/apk/debug/app-debug.apk
          
