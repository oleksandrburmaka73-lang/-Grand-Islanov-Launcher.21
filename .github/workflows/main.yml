name: Build Grand Islanov Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The repository currently contains a root-level file named "app".
      # Remove that placeholder before creating the Android module directories.
      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f app ]; then
            rm app
          fi

          mkdir -p app/src/main/java/com/grandislanov/launcher app/src/main/assets/images

          if [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi
          if [ -f MainActivity.kt ]; then
            cp MainActivity.kt app/src/main/java/com/grandislanov/launcher/MainActivity.kt
          fi
          if [ -f index.html ]; then
            cp index.html app/src/main/assets/index.html
          fi
          if [ -f hero-launcher.png ]; then
            cp hero-launcher.png app/src/main/assets/images/hero-launcher.png
          fi

          if [ ! -f app/build.gradle ]; then
            cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.grandislanov.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.grandislanov.launcher'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
EOF
          fi

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/grandislanov/launcher/MainActivity.kt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grand-Islanov-Launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
