name: Build Grand Islanov Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/com/grandislanov/launcher
          mkdir -p app/src/main/assets

          if [ -f MainActivity.kt ]; then
            cp MainActivity.kt app/src/main/java/com/grandislanov/launcher/
          fi

          if [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml app/src/main/
          fi

          if [ -f index.html ]; then
            cp index.html app/src/main/assets/
          fi

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grand-Islanov-Launcher
          path: app/build/outputs/apk/debug/app-debug.apk
